<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>金铲铲之战 · 登录</title>
<style>
  :root {
    --gold-1: #f7d774;
    --gold-2: #e0a93b;
    --gold-3: #b87a1e;
    --gold-glow: rgba(247, 215, 116, 0.55);
    --bg-deep: #0b1026;
    --bg-mid: #161a3a;
    --ink: #f4ecd6;
    --muted: #b9b6cf;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background:
      radial-gradient(1200px 700px at 80% -10%, rgba(247, 215, 116, 0.14), transparent 60%),
      radial-gradient(900px 600px at 10% 110%, rgba(120, 90, 255, 0.18), transparent 60%),
      linear-gradient(160deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* 漂浮的金色光点 */
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    width: 4px; height: 4px;
    border-radius: 50%;
    background: var(--gold-1);
    box-shadow: 0 0 10px 2px var(--gold-glow);
    animation: float 9s infinite ease-in-out;
    opacity: .8;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) scale(1); opacity: .25; }
    50% { transform: translateY(-22px) scale(1.4); opacity: .9; }
  }

  .card {
    position: relative;
    width: 380px;
    max-width: 92vw;
    padding: 38px 34px 30px;
    border-radius: 22px;
    background: linear-gradient(180deg, rgba(30, 34, 66, 0.92), rgba(16, 19, 42, 0.96));
    border: 1px solid rgba(247, 215, 116, 0.35);
    box-shadow:
      0 0 0 1px rgba(247, 215, 116, 0.12) inset,
      0 18px 60px rgba(0, 0, 0, 0.55),
      0 0 60px rgba(247, 215, 116, 0.12);
    backdrop-filter: blur(6px);
    z-index: 2;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: -1px;
    border-radius: 22px;
    padding: 1px;
    background: linear-gradient(135deg, var(--gold-1), transparent 40%, transparent 60%, var(--gold-2));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: .6;
    pointer-events: none;
  }

  .logo {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 22px;
  }
  .logo svg { filter: drop-shadow(0 6px 16px var(--gold-glow)); }
  .logo h1 {
    margin-top: 12px;
    font-size: 26px;
    letter-spacing: 4px;
    background: linear-gradient(180deg, #fff4cf, var(--gold-2) 70%, var(--gold-3));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 2px 18px rgba(247, 215, 116, 0.25);
  }
  .logo p {
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 6px;
    color: var(--muted);
  }

  .field {
    position: relative;
    margin-bottom: 16px;
  }
  .field svg {
    position: absolute;
    left: 14px; top: 50%;
    transform: translateY(-50%);
    width: 18px; height: 18px;
    fill: var(--gold-2);
  }
  .field input {
    width: 100%;
    padding: 13px 14px 13px 44px;
    border-radius: 12px;
    border: 1px solid rgba(247, 215, 116, 0.22);
    background: rgba(8, 11, 28, 0.6);
    color: var(--ink);
    font-size: 14px;
    outline: none;
    transition: border-color .2s, box-shadow .2s;
  }
  .field input::placeholder { color: #7d7a98; }
  .field input:focus {
    border-color: var(--gold-1);
    box-shadow: 0 0 0 3px rgba(247, 215, 116, 0.15);
  }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    margin: 4px 2px 22px;
  }
  .row label { display: flex; align-items: center; gap: 7px; cursor: pointer; }
  .row input { accent-color: var(--gold-2); width: 15px; height: 15px; }
  .row a { color: var(--gold-1); text-decoration: none; }
  .row a:hover { text-decoration: underline; }

  .btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 6px;
    color: #3a2a06;
    cursor: pointer;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 55%, var(--gold-3));
    box-shadow: 0 8px 24px rgba(247, 215, 116, 0.35), 0 0 0 1px rgba(255,255,255,.2) inset;
    transition: transform .12s, box-shadow .2s, filter .2s;
  }
  .btn:hover { filter: brightness(1.06); box-shadow: 0 10px 30px rgba(247, 215, 116, 0.5); }
  .btn:active { transform: translateY(1px) scale(.99); }

  .divider {
    display: flex; align-items: center; gap: 12px;
    margin: 22px 0 16px;
    color: #6f6c8c; font-size: 12px;
  }
  .divider::before, .divider::after {
    content: ""; flex: 1; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(247,215,116,.3), transparent);
  }

  .socials { display: flex; justify-content: center; gap: 16px; }
  .socials a {
    width: 42px; height: 42px;
    border-radius: 50%;
    display: grid; place-items: center;
    border: 1px solid rgba(247, 215, 116, 0.25);
    background: rgba(8, 11, 28, 0.5);
    transition: border-color .2s, transform .2s, box-shadow .2s;
  }
  .socials a:hover {
    border-color: var(--gold-1);
    transform: translateY(-2px);
    box-shadow: 0 6px 18px rgba(247, 215, 116, 0.25);
  }
  .socials svg { width: 20px; height: 20px; fill: var(--gold-1); }

  .foot {
    margin-top: 22px;
    text-align: center;
    font-size: 12px;
    color: #6f6c8c;
  }
  .foot a { color: var(--gold-1); text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="card">
    <div class="logo">
      <!-- 金色铲铲图标 -->
      <svg width="72" height="72" viewBox="0 0 64 64" fill="none">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#fff4cf"/>
            <stop offset="0.55" stop-color="#e0a93b"/>
            <stop offset="1" stop-color="#b87a1e"/>
          </linearGradient>
        </defs>
        <!-- 铲面 -->
        <rect x="14" y="8" width="36" height="26" rx="8" fill="url(#g)" stroke="#7a4f12" stroke-width="1.5"/>
        <rect x="20" y="13" width="24" height="16" rx="5" fill="#fff4cf" opacity="0.55"/>
        <!-- 铲柄 -->
        <rect x="29" y="32" width="6" height="22" rx="3" fill="url(#g)" stroke="#7a4f12" stroke-width="1.2"/>
        <!-- 底部圆头 -->
        <circle cx="32" cy="56" r="5" fill="url(#g)" stroke="#7a4f12" stroke-width="1.2"/>
      </svg>
      <h1>金铲铲之战</h1>
      <p>GOLDEN SPATULA</p>
    </div>

    <form onsubmit="return false;">
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0-5-5 5 5 0 0 0 5 5Zm0 2c-4 0-9 2-9 6v2h18v-2c0-4-5-6-9-6Z"/></svg>
        <input type="text" placeholder="账号 / 手机号" autocomplete="username" />
      </div>
      <div class="field">
        <svg viewBox="0 0 24 24"><path d="M17 9V7a5 5 0 0 0-10 0v2H5v12h14V9Zm-8-2a3 3 0 0 1 6 0v2H9Zm10 2h-2v2h2Z"/></svg>
        <input type="password" placeholder="密码" autocomplete="current-password" />
      </div>

      <div class="row">
        <label><input type="checkbox" /> 记住我</label>
        <a href="#">忘记密码？</a>
      </div>

      <button class="btn">登 录</button>
    </form>

    <div class="divider">其他方式登录</div>
    <div class="socials">
      <a href="#" title="微信"><svg viewBox="0 0 24 24"><path d="M9 4C5 4 2 6.6 2 9.8c0 1.8 1 3.4 2.6 4.5L4 16l2.3-1.2c.8.2 1.6.3 2.4.3h.6a5.3 5.3 0 0 1-.2-1.4C9.1 9.3 12.4 6.8 16.3 6.8h.5C16 5.5 12.9 4 9 4Zm-2.4 3.2a1 1 0 1 1 0 2 1 1 0 0 1 0-2Zm4.8 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2ZM22 14.4c0-2.6-2.6-4.7-5.8-4.7s-5.8 2.1-5.8 4.7 2.6 4.7 5.8 4.7c.7 0 1.3-.1 1.9-.3L20 20l-.5-1.6c1.5-.9 2.5-2.2 2.5-3.9Zm-7.7-1a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Zm3.8 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6Z"/></svg></a>
      <a href="#" title="QQ"><svg viewBox="0 0 24 24"><path d="M12 3c3.3 0 5.5 2.8 5.5 6.4 0 1.6.7 2.5 1.3 3.8.6 1.3.6 2.3-.3 2.4-.8.1-1.5-1-2-2-.4 2.4-1.8 4-4.5 4-2.7 0-4.1-1.6-4.5-4-.5 1-1.2 2.1-2 2-.9-.1-.9-1.1-.3-2.4.6-1.3 1.3-2.2 1.3-3.8C6.5 5.8 8.7 3 12 3Z"/></svg></a>
      <a href="#" title="游客"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6Zm0 13.5a7.5 7.5 0 0 1-6-3c.2-2 4-3.1 6-3.1s5.8 1.1 6 3.1a7.5 7.5 0 0 1-6 3Z"/></svg></a>
    </div>

    <div class="foot">还没有账号？<a href="#">立即注册</a></div>
  </div>

  <script>
    // 生成漂浮金色光点
    const stars = document.getElementById('stars');
    const count = 40;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('span');
      s.className = 'star';
      s.style.left = Math.random() * 100 + 'vw';
      s.style.top = Math.random() * 100 + 'vh';
      s.style.animationDelay = (Math.random() * 9) + 's';
      s.style.animationDuration = (7 + Math.random() * 5) + 's';
      const scale = 0.5 + Math.random();
      s.style.width = s.style.height = (3 * scale) + 'px';
      stars.appendChild(s);
    }

    document.querySelector('.btn').addEventListener('click', () => {
      const btn = document.querySelector('.btn');
      const old = btn.textContent;
      btn.textContent = '登 录 中…';
      btn.style.filter = 'brightness(.95)';
      setTimeout(() => { btn.textContent = old; btn.style.filter = ''; }, 1200);
    });
  </script>
</body>
</html>
